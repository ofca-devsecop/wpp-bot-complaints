services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sicar
      POSTGRES_PASSWORD: sicar
      POSTGRES_DB: sicar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicar -d sicar"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sicar:sicar@db:5432/sicar
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
